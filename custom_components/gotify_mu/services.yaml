send:
  name: Send notification
  description: Send a notification through a configured Gotify MU channel.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional Gotify MU config entry ID. If omitted, the first configured instance is used.
      required: false
      selector:
        text:
    title:
      name: Title
      required: false
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      description: Gotify priority from 0 through 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          mode: slider
    markdown:
      name: Markdown
      description: Render the message as Markdown on clients that support Gotify message extras.
      required: false
      default: false
      selector:
        boolean:
