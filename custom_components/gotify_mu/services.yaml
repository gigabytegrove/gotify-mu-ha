send:
  name: Push Message
  description: Push a text, Markdown, or hosted image message to a selected Monita Channel.
  fields:
    channel:
      name: Channel
      description: Choose the Monita notification entity for the Channel that should receive this message.
      required: false
      selector:
        entity:
          domain: notify
    entry_id:
      name: Monita server (advanced)
      description: Compatibility option for existing automations. Usually choose Channel instead.
      required: false
      selector:
        config_entry:
          integration: gotify_mu
    title:
      name: Title
      required: false
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      description: Monita priority from 0 through 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: slider
    markdown:
      name: Markdown
      description: Render the message as Markdown on clients that support Gotify-compatible message extras.
      required: false
      default: false
      selector:
        boolean:
    image_entity:
      name: Image entity
      description: Capture a current Home Assistant camera/image and upload the bytes to Monita. Image staging remains available on Channel application-token connections.
      required: false
      selector:
        entity:
          domain:
            - camera
            - image
    image_url:
      name: Image URL
      description: Download an HTTP/HTTPS JPEG, PNG, GIF, or WebP through Home Assistant (maximum 10 MiB), then upload the bytes to Monita. Mutually exclusive with Image entity.
      required: false
      selector:
        text:
          type: url
    extras:
      name: Monita extras
      description: Optional advanced Monita extras. The Home Assistant origin marker is merged into these values.
      required: false
      selector:
        object:
