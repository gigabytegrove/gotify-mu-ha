send:
  name: Send notification
  description: Send a notification through a configured Gotify MU channel.
  fields:
    entry_id:
      name: Gotify MU entry
      description: The configured Gotify MU channel. If omitted, the first loaded entry is used.
      required: false
      selector:
        config_entry:
          integration: gotify_mu
    title:
      name: Title
      required: false
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      description: Gotify priority from 0 through 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: slider
    markdown:
      name: Markdown
      description: Render the message as Markdown on clients that support Gotify message extras.
      required: false
      default: false
      selector:
        boolean:
    image_entity:
      name: Image entity
      description: Capture the current image from a camera or image entity and upload the actual image bytes to Gotify MU so remote and mobile clients can access it.
      required: false
      selector:
        entity:
          domain:
            - camera
            - image
    image_url:
      name: Image URL
      description: Download an HTTP or HTTPS image through Home Assistant, then upload the actual image bytes to Gotify MU so remote and mobile clients do not need access to the source URL.
      required: false
      selector:
        text:
          type: url
    extras:
      name: Gotify extras
      description: Optional advanced Gotify extras. The Home Assistant origin marker is merged into these values.
      required: false
      selector:
        object:
