name: Sync canonical branding rasters

on:
  push:
    branches:
      - main
      - branding/canonical-2026-10
    paths:
      - branding/MonitaHomeAssistant_Full-01.svg
      - branding/Monita_HA_Icon-01.svg
      - scripts/render_branding.py
      - .github/workflows/sync-branding.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deterministic SVG renderer
        run: python -m pip install "CairoSVG==2.8.2"
      - name: Refresh branch head
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - name: Render supplied artwork
        run: python scripts/render_branding.py
      - name: Commit raster copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Branding rasters already synchronized."
            exit 0
          fi
          git commit -m "Sync canonical Monita HA branding rasters [skip ci]"
          git push
