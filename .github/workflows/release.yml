name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/gotify_mu/manifest.json").read_text()
          )
          print(manifest["version"])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release publication
        id: publication
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$VALIDATED_SHA" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
              echo "$TAG already points to $TAG_SHA; refusing to overwrite it from $VALIDATED_SHA."
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

      - name: Build deterministic release package
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f gotify_mu.zip SHA256SUMS
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path("custom_components/gotify_mu")
          with ZipFile("gotify_mu.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  if "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  name = (Path("gotify_mu") / path.relative_to(root)).as_posix()
                  info = ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o644 & 0xFFFF) << 16
                  archive.writestr(info, path.read_bytes())
          PY
          sha256sum gotify_mu.zip > SHA256SUMS
          unzip -t gotify_mu.zip

      - name: Create release tag
        if: steps.publication.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$VALIDATED_SHA" -m "Monita for Home Assistant $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" gotify_mu.zip SHA256SUMS --clobber
            exit 0
          fi

          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi

          gh release create "$TAG" \
            gotify_mu.zip SHA256SUMS \
            --title "Monita for Home Assistant $TAG" \
            --notes "See CHANGELOG.md for release details. This release was created from validated commit $VALIDATED_SHA." \
            "${PRERELEASE[@]}"
